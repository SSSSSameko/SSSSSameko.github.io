name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: bash -n deploy/install.sh
      - run: npx playwright install --with-deps chromium
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Verify dependency licenses
        run: npm run licenses:check
      - name: Run unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Verify deployment contract
        run: node scripts/test-deploy-contract.mjs
      - name: Test HTTP service
        run: node scripts/test-server-http.mjs
      - name: Test draw retention recovery
        run: node scripts/test-draw-retention-recovery.mjs
      - name: Test service lifecycle
        shell: bash
        run: |
          set +e
          node scripts/test-server-lifecycle.mjs 2>&1 | tee /tmp/service-lifecycle.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            message="$(tail -n 40 /tmp/service-lifecycle.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Service lifecycle regression::${message}"
          fi
          exit "${status}"
      - name: Test Weibo provider fallback
        run: node scripts/test-weibo-provider-fallback.mjs
      - name: Test browser lifecycle
        run: npm run test:browser-lifecycle
      - name: Test memory stability
        run: node scripts/test-memory-soak.mjs
      - name: Test production UI
        run: npm run test:ui:built
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  node-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm test
      - run: npm run build

  node-20:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm test
      - run: npm run build

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm test
      - run: npm run build

  deploy:
    needs: [build, node-20, node-24, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
